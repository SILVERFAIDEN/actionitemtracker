services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: action_tracker
      POSTGRES_USER: tracker_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data

  app:
    build: .
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:8001:8000"
    depends_on:
      - db

volumes:
  pgdata:
